[env_common_esp32tx]
extends = env_common_esp32
monitor_speed = 460800
lib_deps =
	${env_common_esp32.lib_deps}
	h2zero/NimBLE-Arduino @ 2.4.0
	https://github.com/lemmingdev/ESP32-BLE-Gamepad#master
	olikraus/U8g2 @ 2.36.18
	moononournation/GFX Library for Arduino @ 1.6.6
build_src_filter = ${env_common_esp32.build_src_filter} -<rx_*.cpp> -<rx-*/>
build_flags =
	${env_common_esp32.build_flags}
	${common_env_data.build_flags_tx}
	-include target/Unified_ESP32_TX.h
	-D VTABLES_IN_FLASH=1
	-O2

[env_common_esp32tx_hybrid]
extends = env_common_esp32tx
custom_component_remove = espressif/esp-modbus
custom_sdkconfig =

[env:Unified_ESP32_2400_TX_via_ETX]
extends = env_common_esp32tx_hybrid, radio_SX128X
build_flags =
	${env_common_esp32tx.build_flags}
	${radio_SX128X.build_flags}

[env:Unified_ESP32_2400_TX_via_UART]
extends = env:Unified_ESP32_2400_TX_via_ETX

[env:Unified_ESP32_2400_TX_via_WIFI]
extends = env:Unified_ESP32_2400_TX_via_ETX

[env:Unified_ESP32_900_TX_via_ETX]
extends = env_common_esp32tx_hybrid, radio_SX127X
build_flags =
	${env_common_esp32tx.build_flags}
	${radio_SX127X.build_flags}

[env:Unified_ESP32_900_TX_via_UART]
extends = env:Unified_ESP32_900_TX_via_ETX

[env:Unified_ESP32_900_TX_via_WIFI]
extends = env:Unified_ESP32_900_TX_via_ETX

[env:Unified_ESP32_LR1121_TX_via_ETX]
extends = env_common_esp32tx_hybrid, radio_LR1121
build_flags =
	${env_common_esp32tx.build_flags}
	${radio_LR1121.build_flags}

[env:Unified_ESP32_LR1121_TX_via_UART]
extends = env:Unified_ESP32_LR1121_TX_via_ETX

[env:Unified_ESP32_LR1121_TX_via_WIFI]
extends = env:Unified_ESP32_LR1121_TX_via_ETX
